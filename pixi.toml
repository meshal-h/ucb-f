[workspace]
name = "ucb-f"
channels = ["conda-forge"]
platforms = [
    { platform = "win-64" },
    { platform = "linux-64" },
]

[dependencies]
python = "3.12.*"
numpy = ">=1.26,<2"
matplotlib = ">=3.11.2,<4"
gymnasium = ">=0.29,<1"
